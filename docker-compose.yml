
services:
  scraper:
    build: ./scraper
    container_name: wb_reviews_scraper
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - scraper_data:/app/data
      - ./scraper/prompts:/app/prompts:ro
    ports:
      - "8100:8000"
    networks:
      - wb_reviews_network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # n8n запускается отдельным профилем, чтобы не мешать тестам Python-сервиса:
  #   docker compose --profile n8n up -d
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: wb_reviews_n8n
    restart: unless-stopped
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Публичный HTTPS-адрес. Нужен, чтобы Telegram Trigger мог зарегистрировать
      # webhook: Telegram принимает ТОЛЬКО https. Для локальных тестов это туннель
      # (localhost.run / ngrok), в продакшене — реальный домен вида https://n8n.example.com.
      # Пустое значение = n8n возьмёт http://localhost:5678, и Telegram-триггер не активируется.
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=Asia/Novosibirsk
      - TZ=Asia/Novosibirsk
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      # $env.ALLOWED_USER_ID / $env.TELEGRAM_CHANNEL_ID используются в воркфлоу.
      # В n8n 1.x доступ к env из выражений по умолчанию выключен — включаем.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - ALLOWED_USER_ID=${ALLOWED_USER_ID}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    networks:
      - wb_reviews_network

volumes:
  scraper_data:
    driver: local
  n8n_data:
    driver: local

networks:
  wb_reviews_network:
    driver: bridge
